[workspace]
resolver = "2"
members = [
    "delphos/cognition/core",
    "delphos/domains/speculum/identity",
    "delphos/domains/katoptron/projection",
    "delphos/domains/katoptron/ecs",
    "delphos/domains/styx/lanes",
    "delphos/domains/thalassa/scheduler",
    "delphos/domains/thalassa/mission",
    "delphos/domains/thalassa/task",
    "delphos/cognition/query",
    "delphos/cognition/workflow",
    "delphos/cognition/project",
    "delphos/cognition/state",
    "delphos/cognition/abi",
    "delphos/cognition/clock",
    "delphos/cognition/schema",
    "delphos/cognition/kernel",
    "delphos/cognition/event",
    "delphos/cognition/contracts",
    "delphos/domains/thalassa/runtime",
    "delphos/domains/thalassa/orchestrator",
    "delphos/domains/arche/capsule",
    "delphos/domains/arche/store",
    "delphos/domains/styx/provider",
    "delphos/domains/styx/tools",
    "delphos/domains/katoptron/crypto",
    "delphos/domains/katoptron/verifier",
    "delphos/domains/anamnesis/policy",
    "delphos/domains/mnemos/memory",
    "delphos/domains/mnemos/replay",
    "delphos/domains/thalassa/providers",
    "delphos/domains/thalassa/agents",
    "delphos/domains/thalassa/session",
    "delphos/cognition/protocol",
    "delphos/domains/katoptron/telemetry",
    "delphos/reflection/ui/atlantean",
    "delphos/threshold/cli",
    "delphos/reflection/inspector",
    "delphos/calibration/testing",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT"
authors    = ["BKG Contributors"]
repository = "https://github.com/soniaschuh88-ship-it/bkg"

[workspace.dependencies]
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
uuid           = { version = "1", features = ["v4", "serde"] }
hex            = "0.4"
blake3         = "1"
ed25519-dalek  = { version = "2", features = ["serde"] }
rand           = "0.8"
getrandom      = { version = "0.2", features = ["std"] }
thiserror      = "1"
anyhow         = "1"
tokio          = { version = "1", features = ["full"] }
tokio-stream   = { version = "0.1", features = ["sync"] }
petgraph       = "0.6"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap           = { version = "4", features = ["derive", "env"] }
chrono         = { version = "0.4", features = ["serde"] }
sled           = "0.34"
async-trait    = "0.1"
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bkg-schema = { path = "delphos/cognition/schema" }
bkg-clock  = { path = "delphos/cognition/clock" }
bkg-abi    = { path = "delphos/cognition/abi" }
bkg-state  = { path = "delphos/cognition/state" }
bkg-project    = { path = "delphos/cognition/project" }
bkg-workflow    = { path = "delphos/cognition/workflow" }
bkg-query    = { path = "delphos/cognition/query" }
bkg-task    = { path = "delphos/domains/thalassa/task" }
bkg-mission    = { path = "delphos/domains/thalassa/mission" }
bkg-scheduler    = { path = "delphos/domains/thalassa/scheduler" }
bkg-lanes    = { path = "delphos/domains/styx/lanes" }
bkg-ecs    = { path = "delphos/domains/katoptron/ecs" }
bkg-projection    = { path = "delphos/domains/katoptron/projection" }
bkg-identity    = { path = "delphos/domains/speculum/identity" }
bkg-core         = { path = "delphos/cognition/core" }
bkg-crypto       = { path = "delphos/domains/katoptron/crypto" }
bkg-event        = { path = "delphos/cognition/event" }
bkg-contracts    = { path = "delphos/cognition/contracts" }
bkg-kernel       = { path = "delphos/cognition/kernel" }
bkg-swd          = { path = "delphos/domains/styx/provider" }
bkg-capsule      = { path = "delphos/domains/arche/capsule" }
bkg-store        = { path = "delphos/domains/arche/store" }
bkg-memory       = { path = "delphos/domains/mnemos/memory" }
bkg-replay       = { path = "delphos/domains/mnemos/replay" }
bkg-verifier     = { path = "delphos/domains/katoptron/verifier" }
bkg-policy       = { path = "delphos/domains/anamnesis/policy" }
bkg-runtime      = { path = "delphos/domains/thalassa/runtime" }
bkg-orchestrator = { path = "delphos/domains/thalassa/orchestrator" }
bkg-acp        = { path = "delphos/cognition/protocol" }
bkg-session    = { path = "delphos/domains/thalassa/session" }
bkg-agents    = { path = "delphos/domains/thalassa/agents" }
bkg-providers    = { path = "delphos/domains/thalassa/providers" }
bkg-telemetry    = { path = "delphos/domains/katoptron/telemetry" }
bkg-atlantean    = { path = "delphos/reflection/ui/atlantean" }
bkg-tools        = { path = "delphos/domains/styx/tools" }
bkg-inspector    = { path = "delphos/reflection/inspector" }
